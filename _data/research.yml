# ---------- 第三级：意识内容 ----------
- id: imagination
  parent: content
  title: Imagination
  note: Mental Imagery and Aphantasia
  status: active
  summary: >
    Roughly 5% of people cannot picture anything. Their visual cortex responds
    normally to imagery; what is missing is the coupling that would make the signal
    reachable. The question is where in that chain the failure sits — and the answer
    requires a paradigm that can read an imagery signal without the participant
    ever seeing one.
  url: /research/imagination/
  go: Open the timeline →

