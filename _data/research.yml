# ---------- 顶级：Consciousness ----------
- id: consciousness
  parent: root
  title: Consciousness
  note: As it is, not as it ought to be
  status: active
  summary: >
    What consciousness is made of and what state a brain is in when it has any
    content at all. The first is measured behaviourally and with stimulation; the
    second is modelled from resting-state imaging.
