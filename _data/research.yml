#  再加项目时：这里加一条 parent: root，再写一个 _pages/research/*.md。
# ============================================================

- id: brainstate
  parent: root
  title: BrainState
  note: A brain-state measurement toolkit for resting-state fMRI
  status: active
  summary: >
    What state is a brain in when it has any content at all? Several metrics of
    resting-state fMRI folded into one computational model, so that the question
    can be answered with numbers rather than adjectives.
  url: /research/brain-state/
  go: Open →

- id: imagination
  parent: root
  title: Mental Imagery
  note: Aphantasia and the route from image to awareness · first round complete
  status: active
  summary: >
    Roughly 2–4% of people cannot picture anything, yet their visual cortex
    responds to imagery much as anyone else's. A first behavioural round (n = 30)
    is in; the question now is where in the chain an image fails to reach
    awareness.
  url: /research/imagination/
  go: Open →
