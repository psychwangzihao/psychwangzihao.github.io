<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>心的眼睛 · The Mind's Eye</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./style.css">
</head>
<body>

  <!-- 舞台：所有场景都渲染在这里 -->
  <div id="stage"></div>

  <!-- 顶部进度条 -->
  <div id="progress"><i id="progressFill"></i></div>

  <!-- 底部场景导航（圆点） -->
  <nav id="navbar" aria-label="场景导航"><div id="dots"></div></nav>

  <!-- 黑屏层（按 X，翻页笔的黑屏键常发 . 也支持） -->
  <div id="blackout"></div>

  <!-- 调试面板（按 D 或 ?debug=1） -->
  <div id="debug"></div>

  <!-- 全屏按钮 -->
  <button id="fsbtn" title="全屏 / 退出全屏 (F)">⛶</button>

  <!-- 轻提示 -->
  <div id="toast"></div>

  <!-- 2050 的记号：整场常驻，很小很暗，只是一个在场的标志 -->
  <img id="mx-mark" src="./media/2050-logo.png" alt="2050">

  <script src="./icons.js"></script>
  <script src="./core.js"></script>
  <script src="./pixel.js"></script>

  <!-- ⚠️ 顺序 = 讲稿顺序，由下面的先后决定，不是文件名。
       科学 → 差异 → 重建 → 回到艺术 → 收尾。改顺序改这里。 -->

  <!-- 开场：2050 的字号从像素里解析出来（本身就是「建构」的演示） -->
  <script src="./s00_open.js"></script>

  <!-- 一、感知是什么：转译不是接收 → 每个感官只有一扇窄窗 → 物种各取一片 -->
  <script src="./s01_sense.js"></script>

  <!-- 二、不完备：视觉在漏 → 其他通道也在漏 → 缺不会以「缺」出现 -->
  <script src="./s02_gaps.js"></script>

  <!-- 三、脑补：不存在的边 → 阅读的补全 → 通道互相改写 → 身体也在被建构 -->
  <script src="./s03_fill.js"></script>

  <!-- 四、想象：同一台机器空转 → 不是虚的 → 四个模态 -->
  <script src="./s04_imagine.js"></script>

  <!-- 五、想象的谱：现场报数（唯一必须用浏览器的一屏）→ 心盲 → 超幻 → 模态分开 -->
  <script src="./s05_ispectrum.js"></script>

  <!-- 六、感知的谱：缺失/偏弱/过强 → 色觉模拟 → 四色视与联觉 → 可以被练 -->
  <script src="./s06_pspectrum.js"></script>

  <!-- 七、重建：感官替代 → 换硬件 → 大脑只找规律 -->
  <script src="./s07_rebuild.js"></script>

  <!-- 八、不需要输入：幻觉 → 梦 → 幻肢 -->
  <script src="./s08_without.js"></script>

  <!-- 九、回到艺术：艺术一直在做感知实验 → 那条边 → 交回一个问题 -->
  <script src="./s09_art.js"></script>

  <!-- 十、展览 + 二维码（收） -->
  <script src="./s10_exhibition.js"></script>
</body>
</html>
